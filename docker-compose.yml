services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Stateless: no volumes, no env, nothing persisted (godfat cached in RAM).

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # The Vite dev-server proxies /api to the backend service.
      BCPE_BACKEND: http://backend:8000
    depends_on:
      - backend
