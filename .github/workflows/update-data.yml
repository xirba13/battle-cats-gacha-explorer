name: Update banner data
# The site's banner data (events, gacha pools, cats) comes from godfat's
# public GitLab repo. This rebuilds it every day and commits it when it
# changed; the site is static, so that commit is what publishes new banners.
on:
  schedule:
    - cron: "23 4 * * *" # every day at 04:23 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # the pnpm version in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rebuild the data
        run: pnpm run update-data
      - name: Commit it if it changed
        run: |
          if git diff --quiet -- public/data/godfat_bcen.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/godfat_bcen.json
          git commit -m "data: update godfat banner data"
          git pull --rebase
          git push
